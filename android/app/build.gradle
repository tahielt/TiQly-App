apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// CRÍTICO: Se ha eliminado 'apply plugin: "com.facebook.react"' ya que causó el error "Plugin not found".
// En su lugar, incluimos el script de compilación directamente.
// NOTA: Si el error 'Could not read script' persiste, asegúrate de haber ejecutado 'npm install'
// y que la ruta sea correcta. Hemos añadido una pequeña mejora de sintaxis para mayor robustez.
apply from: file("../../node_modules/react-native/react.gradle") // Fix: Added file() for robustness

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def frescoVersion = "2.6.0" // Versión de Fresco temporal para evitar dependencias fallidas

// --- Lógica personalizada de RN/Expo (Preservada) ---
static def versionToNumber(major, minor, patch) {
return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
def version = providers.exec {
workingDir(projectDir)
commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
}.standardOutput.asText.get().trim()

def coreVersion = version.split("-")[0]
def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

return versionToNumber(
major,
minor,
patch
)
}
def rnVersion = getRNVersion()
// ---------------------------------------------------

/**
 * NOTA CRÍTICA: El bloque 'react { ... }' fue comentado/removido.
 * Este bloque depende del plugin 'com.facebook.react' que estaba fallando al ser resuelto.
